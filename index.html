<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabiatni asrang!</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }
    header {
      background: #2e7d32;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .images {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .images img {
      width: 30%;
      min-width: 200px;
      border-radius: 8px;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      resize: vertical;
    }
  </style>
</head>
<body>
  <header>Tabiatni asrang!</header>

  <div class="container">
    <div class="images">
      <img src="https://picsum.photos/seed/nature1/400/250" alt="Tabiat manzarasi" />
      <img src="https://picsum.photos/seed/nature2/400/250" alt="Tabiat manzarasi" />
      <img src="https://picsum.photos/seed/nature3/400/250" alt="Tabiat manzarasi" />
    </div>

    <textarea placeholder="Bu yerga matn kiriting..."></textarea>
    <textarea placeholder="Ikkinchi matn maydoni..."></textarea>
  </div>
</body>
</html>

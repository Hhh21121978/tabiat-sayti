<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Tabiat sayti</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff6cc; /* ochiq sariq fon */
        }

        /* MENYU */
        .menu {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ccc;
        }

        .menu a {
            margin: 0 25px;
            text-decoration: none;
            font-weight: bold;
            color: #3b6fb6;
            font-size: 18px;
        }

        .menu a:hover {
            text-decoration: underline;
        }

        /* ASOSIY KONTENT */
        .container {
            display: flex;
            padding: 30px;
        }

        .left {
            width: 30%;
            text-align: center;
        }

        .left img {
            width: 200px;
            border: 2px solid #555;
            padding: 5px;
            background: #fff;
        }

        .right {
            width: 70%;
            padding-left: 30px;
        }

        .right h2 {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- MENYU -->
    <div class="menu">
        <a href="#">ASOSIY</a>
        <a href="#">TABIAT</a>
        <a href="#">INFO</a>
        <a href="#">HAQIDA</a>
    </div>

    <!-- KONTENT -->
    <div class="container">
        <!-- CHAP: RASM -->
        <div class="left">
            <img src="rasm1.png" alt="Tabiat rasmi">
            <p>RASM 1</p>
        </div>

        <!-- O‘NG: MATN -->
        <div class="right">
            <h2>Tabiat — asosiy boyligimiz</h2>
            <p>
                Tabiatni asrash har bir insonning muqaddas burchidir.
                Atrof-muhitni toza saqlash orqali kelajak avlodga sog‘lom
                hayot qoldiramiz.
            </p>
            <p>
                Ushbu sayt tabiat, texnika va foydali ma’lumotlarga bag‘ishlangan.
            </p>
        </div>
    </div>

</body>
</html>
